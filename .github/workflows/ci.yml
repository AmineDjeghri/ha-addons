# =============================================================================
# CI — Quality Checks
# =============================================================================
# Validates the personal-app add-on on pull requests that touch it.
# There is no push trigger: feature branches are validated through their pull request (a push trigger
# doubled every check). Pushes to main/dev are handled by release.yml.
# =============================================================================
name: "👷 CI — Validate"
on:
  pull_request:
    types: [opened, edited, synchronize]
    branches:
      - "**"
    paths:
      - "addons/personal-app/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/quality-and-tests.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/**"
      - ".pre-commit-config.yaml"
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
permissions: {}
jobs:
  validate-pr-title:
    name: "📝 Validate PR Title"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - name: Check Conventional Commits format
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            // Pattern matches commitizen schema from pyproject.toml
            // Supports: [emoji] <type>[(<scope>)][!]: <description>
            const pattern = /^[^\w\n]*(feat|feature|fix|bugfix|hotfix|perf|refactor|docs|style|test|chore|ci|build)(\([^)]*\))?!?:\s.+/;
            if (!pattern.test(title)) {
              core.setFailed(
                `❌ PR title does not follow Conventional Commits format.\n\n` +
                `Got: "${title}"\n\n` +
                `Expected format: <type>[(<scope>)][!]: <description>\n\n` +
                `Valid types:\n` +
                `  • feat, feature       → minor version bump\n` +
                `  • fix, bugfix, hotfix → patch version bump\n` +
                `  • perf                → patch version bump\n` +
                `  • refactor, docs, style, test, chore, ci, build → no release\n\n` +
                `Examples:\n` +
                `  ✅ "feat: add login page"\n` +
                `  ✅ "🎉 feat: add login page"\n` +
                `  ✅ "fix(auth): resolve token expiry"\n` +
                `  ✅ "feat!: breaking API change"\n`
              );
            } else {
              core.info(`✅ PR title is valid: "${title}"`);
            }
  quality-check-and-tests:
    permissions:
      contents: read
    name: "👷 Quality Check & Tests"
    uses: $/.github/workflows/quality-and-tests.yml
