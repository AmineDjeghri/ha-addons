name: Upstream Version Bump

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC
  workflow_dispatch:      # Manual trigger too

jobs:
  bump-octo-fiesta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Get latest upstream dev commit
        id: upstream
        run: |
          SHA=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/V1ck3s/octo-fiesta/commits/dev \
            | jq -r '.sha // empty')
          SHA7="${SHA:0:7}"
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "sha7=$SHA7" >> $GITHUB_OUTPUT
          echo "Latest upstream dev: $SHA7"

      - name: Get current pinned version
        id: current
        run: |
          CURRENT=$(grep -oP '^version: "\K[^"]+' addons/octo-fiesta/config.yaml | head -1)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current pinned: $CURRENT"

      - name: Bump versions
        if: steps.upstream.outputs.sha7 != '' && format('dev-{0}', steps.upstream.outputs.sha7) != steps.current.outputs.current
        run: |
          NEW="dev-${{ steps.upstream.outputs.sha7 }}"
          OLD="${{ steps.current.outputs.current }}"
          OLD_SHA7="${OLD#dev-}"
          NEW_SHA7="${{ steps.upstream.outputs.sha7 }}"
          echo "Bumping $OLD → $NEW"

          # Update config.yaml version (build.json stays pinned to :dev)
          sed -i "s|version: \"${OLD}\"|version: \"${NEW}\"|g" addons/octo-fiesta/config.yaml

          # Generate changelog section from commits since last dev bump
          COMMITS=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/V1ck3s/octo-fiesta/compare/${OLD_SHA7}...${{ steps.upstream.outputs.sha }}" \
            | jq -r '.commits[] | "- [" + (.commit.message | split("\n")[0]) + "](" + .html_url + ")"' \
            | head -20)

          NEW_DATE=$(date +%F)
          # Prepend section; keep header + new section + previous dev sections (max 9 old)
          {
            echo "# Changelog"
            echo ""
            echo "For full upstream release notes see the [official Octo-Fiesta releases](https://github.com/V1ck3s/octo-fiesta/releases)."
            echo ""
            echo "## ${NEW} — ${NEW_DATE}"
            echo ""
            echo "${COMMITS}"
            echo ""
            echo "[Compare ${OLD_SHA7}...${NEW_SHA7}](https://github.com/V1ck3s/octo-fiesta/compare/${OLD_SHA7}...${NEW_SHA7})"
            echo ""
            echo "---"
            echo ""
            # Previous dev sections (max 9): lines after the first '## ' heading
            awk '/^## /{count++} count>=1 && count<=9{print}' addons/octo-fiesta/CHANGELOG.md
          } > /tmp/changelog.tmp && mv /tmp/changelog.tmp addons/octo-fiesta/CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump octo-fiesta ${OLD} → ${NEW}"
          git push

  bump-hermes-webui:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Get latest upstream release
        id: upstream
        run: |
          # GitHub releases use v-prefixed tags; GHCR images are published without the v prefix
          TAG=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nesquena/hermes-webui/releases/latest \
            | jq -r '.tag_name // empty')
          LATEST="${TAG#v}"   # strip leading v for GHCR compatibility
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest upstream (no-v): $LATEST"

      - name: Get current pinned version
        id: current
        run: |
          CURRENT=$(grep -oP 'hermes-webui:\K[^"]+' addons/hermes-webui/build.json | head -1)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current pinned: $CURRENT"

      - name: Bump versions
        if: steps.upstream.outputs.latest != '' && steps.upstream.outputs.latest != steps.current.outputs.current
        run: |
          NEW=${{ steps.upstream.outputs.latest }}
          OLD=${{ steps.current.outputs.current }}
          echo "Bumping $OLD → $NEW"

          # Update build.json (all architectures) — tags on GHCR have no v prefix
          sed -i "s|hermes-webui:${OLD}|hermes-webui:${NEW}|g" addons/hermes-webui/build.json

          # Update config.yaml version
          sed -i "s|version: \"${OLD}\"|version: \"${NEW}\"|g" addons/hermes-webui/config.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump hermes-webui ${OLD} → ${NEW}"
          git push

  bump-beets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Get latest beets release
        id: upstream
        run: |
          VERSION=$(curl -sL https://pypi.org/pypi/beets/json | jq -r '.info.version // empty')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest beets: $VERSION"

      - name: Get current pinned version
        id: current
        run: |
          CURRENT=$(grep -oP '^version: "\K[^"]+' addons/beets/config.yaml | head -1)
          # Addon-only fixes bump a 4th component (e.g. 2.13.1.1); compare only
          # the beets release part (first 3 components).
          BASE=$(printf '%s' "$CURRENT" | cut -d. -f1-3)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "Current pinned: $CURRENT (base $BASE)"

      - name: Bump versions
        if: steps.upstream.outputs.version != '' && steps.upstream.outputs.version != steps.current.outputs.base
        run: |
          NEW=${{ steps.upstream.outputs.version }}
          OLD=${{ steps.current.outputs.current }}
          echo "Bumping $OLD → $NEW"

          # Update config.yaml version (replaces any addon patch suffix) and the Dockerfile pin
          sed -i -E "s|^version: \"[0-9]+\.[0-9]+\.[0-9]+[^\"]*\"|version: \"${NEW}\"|" addons/beets/config.yaml
          sed -i "s|ENV BEETS_VERSION=.*|ENV BEETS_VERSION=${NEW}|" addons/beets/Dockerfile

          # Changelog section from the upstream GitHub release notes
          BODY=$(curl -sL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/beetbox/beets/releases/tags/v${NEW}" \
            | jq -r '.body // "Release notes not available."')
          NEW_DATE=$(date +%F)
          {
            echo "# Changelog"
            echo ""
            echo "For full upstream release notes see the [official Beets releases](https://github.com/beetbox/beets/releases)."
            echo ""
            echo "## ${NEW} — ${NEW_DATE}"
            echo ""
            echo "${BODY}"
            echo ""
            echo "---"
            echo ""
            # Previous sections (max 9): lines after the first '## ' heading
            awk '/^## /{count++} count>=1 && count<=9{print}' addons/beets/CHANGELOG.md
          } > /tmp/changelog.tmp && mv /tmp/changelog.tmp addons/beets/CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump beets ${OLD} → ${NEW}"
          git push
