name: "👷 AIOStreams — Validate & Build"

on:
  push:
    branches: ["**"]
    paths:
      - "addons/aiostreams/**"
      - ".github/workflows/aiostreams.yml"
      - ".github/workflows/upstream-bump.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "addons/aiostreams/**"
      - ".github/workflows/aiostreams.yml"
      - ".github/workflows/upstream-bump.yml"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: config.yaml options/schema key parity
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import sys
          import yaml

          with open("addons/aiostreams/config.yaml") as f:
              cfg = yaml.safe_load(f)

          options = set(cfg["options"])
          schema = set(cfg["schema"])
          if options != schema:
              print("options - schema:", options - schema)
              print("schema - options:", schema - options)
              sys.exit(1)
          print(f"OK — {len(options)} keys match between options and schema")
          PY

      - name: bootstrap.js syntax check
        run: node --check addons/aiostreams/bootstrap.js

      - name: pre-commit (addon files only)
        continue-on-error: false
        run: |
          pip install pre-commit
          pre-commit run --files \
            addons/aiostreams/config.yaml \
            addons/aiostreams/Dockerfile \
            addons/aiostreams/bootstrap.js \
            addons/aiostreams/README.md \
            addons/aiostreams/CHANGELOG.md \
            addons/aiostreams/build.json \
            .github/workflows/aiostreams.yml

  build-and-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - name: Build addon image
        working-directory: addons/aiostreams
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/viren070/aiostreams:nightly \
            -t aiostreams-test .

      - name: Smoke test
        working-directory: addons/aiostreams
        run: | # pragma: allowlist secret
          set -euo pipefail
          trap 'docker rm -f aiostreams-smoke >/dev/null 2>&1 || true' EXIT

          # 64-char hex test key kept on its own shell line so detect-secrets can
          # be silenced with an inline pragma (JSON below cannot carry a comment).
          SECRET_KEY="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"  # pragma: allowlist secret
          cat > /tmp/aiostreams-options.json <<JSON
          {
            "base_url": "http://localhost:18889",
            "secret_key": "${SECRET_KEY}",
            "auth": "ci:CiTestPassword123",
            "auth_required": true,
            "log_level": "info"
          }
          JSON

          docker run -d --name aiostreams-smoke \
            -v /tmp/aiostreams-options.json:/data/options.json \
            -p 18889:3000 \
            aiostreams-test

          echo "Waiting for /api/v1/status ..."
          base=http://127.0.0.1:18889
          ok=""
          for _ in $(seq 1 90); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/v1/status")" = "200" ]; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "status endpoint never returned 200"
            docker logs aiostreams-smoke
            exit 1
          fi
          echo "status OK"

          # auth_required=true, so an HTML navigation without a session must be
          # redirected to the login page (upstream: requireSession -> 302
          # /login?next=<original>), NOT served with 200.
          echo "Checking the auth gate on /stremio/configure ..."
          code_loc="$(curl -s -o /dev/null -H 'Accept: text/html' \
            -w '%{http_code} %{redirect_url}' "$base/stremio/configure")"
          code="${code_loc%% *}"
          location="${code_loc#* }"
          if [ "$code" != "302" ]; then
            echo "expected 302 from an unauthenticated /stremio/configure, got $code ($location)"
            docker logs aiostreams-smoke
            exit 1
          fi
          case "$location" in
            */login?next=*) ;;
            *)
              echo "expected the redirect to point at /login?next=..., got $location"
              docker logs aiostreams-smoke
              exit 1
              ;;
          esac
          echo "auth gate OK — $base/stremio/configure -> $location"

          echo "Logging in with the configured account ..."
          login_code="$(curl -s -c /tmp/aiostreams-cookies.txt -o /tmp/aiostreams-login.json \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"CiTestPassword123"}' \
            -w '%{http_code}' "$base/api/v1/auth/login")"
          if [ "$login_code" != "200" ]; then
            echo "expected 200 from POST /api/v1/auth/login, got $login_code"
            head -c 300 /tmp/aiostreams-login.json || true
            echo
            docker logs aiostreams-smoke
            exit 1
          fi

          code="$(curl -s -b /tmp/aiostreams-cookies.txt -H 'Accept: text/html' \
            -o /dev/null -w '%{http_code}' "$base/stremio/configure")"
          if [ "$code" != "200" ]; then
            echo "expected 200 from /stremio/configure with a session cookie, got $code"
            docker logs aiostreams-smoke
            exit 1
          fi
          echo "configure page OK (authenticated)"

          echo "Checking /data persistence ..."
          rm -rf /tmp/aiostreams-data
          docker cp aiostreams-smoke:/data/. /tmp/aiostreams-data
          ls -la /tmp/aiostreams-data
          if [ ! -s /tmp/aiostreams-data/db.sqlite ]; then
            echo "expected a non-empty /data/db.sqlite (bootstrap wires DATABASE_URI=sqlite:///data/db.sqlite)"
            docker logs aiostreams-smoke
            exit 1
          fi
          echo "persistence OK"

          echo "smoke test passed"
