name: "🚀 Release"

on:
  push:
    branches: [main, dev]
    paths:
      - "addons/personal-app/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/quality-and-tests.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/**"
      - ".pre-commit-config.yaml"
  workflow_dispatch:

permissions: {}

concurrency:
  cancel-in-progress: false
  group: release-${{ github.ref }}

jobs:
  quality-checks:
    permissions:
      contents: read
    name: "👷 Quality Check & Tests"
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    uses: $/.github/workflows/quality-and-tests.yml

  release:
    permissions:
      contents: write
    name: Build and publish release
    needs: quality-checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: addons/personal-app
    outputs:
      tagged: ${{ steps.version.outputs.tagged }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }} # Make checks this tip against the tested GITHUB_SHA.

      - uses: $/.github/actions/install-python-deps
        with:
          profile: release

      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # semantic-release reads the commits of every add-on since the last tag: release only when
      # personal-app itself changed since its last release.
      - name: Check that personal-app changed since its last release
        id: changed
        run: |
          last=$(git describe --tags --abbrev=0 --match 'personal-app-v*' 2>/dev/null || true)
          if [ -z "$last" ] || ! git diff --quiet --relative "$last" HEAD -- .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'personal-app is unchanged since its last release; nothing to do.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build packages and publish version
        id: version
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
        run: make release-version

      - name: Rebuild artifacts when retrying an existing release
        if: steps.version.outputs.tagged == 'true' && steps.version.outputs.released == 'false'
        run: make build-package

      - name: Upload release artifacts
        id: assets
        if: steps.version.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-assets

      - name: Report release outcome
        if: always() && steps.changed.outputs.changed == 'true'
        env:
          VERSION_RESULT: ${{ steps.version.outcome }}
          ASSET_RESULT: ${{ steps.assets.outcome }}
          TAGGED: ${{ steps.version.outputs.tagged }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$VERSION_RESULT" = success ] && [ "$TAGGED" = false ]; then
            echo 'No releasable commits; nothing published.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ASSET_RESULT" = success ]; then
            printf "Release artifacts uploaded for \`%s\`.\n" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Release failed; inspect the failed step before retrying.' >> "$GITHUB_STEP_SUMMARY"
          fi

  docs:
    permissions:
      contents: write
    name: Deploy release documentation
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.tagged == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: addons/personal-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}
      - uses: $/.github/actions/install-python-deps
        with:
          profile: tools
      - name: Deploy documentation from the release tag
        run: make deploy-doc-gh
