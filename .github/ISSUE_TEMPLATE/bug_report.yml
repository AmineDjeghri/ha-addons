name: 🐛 Bug Report
description: Report a bug to help us improve
title: "[BUG] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "## Description"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug in detail
      placeholder: "The issue occurs when..."
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Steps to Reproduce"
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: How to reproduce the bug
      placeholder: "1. Step one\n2. Step two\n3. Step three"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "What should happen..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: "What actually happened..."
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Environment"
  - type: input
    id: addon
    attributes:
      label: Add-on and version
      placeholder: "personal-app 1.2.2"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Core, Supervisor and OS versions (Settings → About)
      placeholder: "Core 2026.11.0, Supervisor 2026.11.0, OS 17.0"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      placeholder: "Any screenshots, error messages, or other info"
