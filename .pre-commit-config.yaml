# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Ruff configuration lives in addons/personal-app/pyproject.toml.
#
# This repository holds several add-ons: the Python-specific hooks below are scoped to
# addons/personal-app/ (the only add-on with Python tooling, docs and workflows of its own).

# Avoid nodeenv's floating "latest", which can select unsupported alpha releases.
default_language_version:
  node: '26.13.1'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [ '--maxkb=3000' ]
      - id: check-toml
      - id: check-yaml
        args: [ '--unsafe' ]  # ProperDocs uses a Python tag for the native Mermaid formatter.
      - id: check-json
      # The other add-ons' CHANGELOG.md files are generated by upstream-bump.yml, which commits without hooks.
      - id: end-of-file-fixer
        exclude: ^addons/(aiostreams|beets|hermes-webui|mediaflow-proxy-light|octo-fiesta)/CHANGELOG\.md$
      - id: trailing-whitespace # This hook trims trailing whitespace
        exclude: ^addons/(aiostreams|beets|hermes-webui|mediaflow-proxy-light|octo-fiesta)/CHANGELOG\.md$
      - id: check-merge-conflict # Check for files that contain merge conflict strings
      - id: mixed-line-ending # Enforce Unix (LF) line endings
        args: [ --fix=lf ]
        exclude: \.(bat|ps1|reg)$ # These stay CRLF per .gitattributes
      - id: name-tests-test
        args: [ --pytest-test-first ]
        exclude: ^addons/personal-app/tests/unit/release/fixtures/release_command\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.4
    hooks:
      - id: commitizen
        stages: [ commit-msg ]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.9
    hooks:
      # Update the uv lockfile of the personal-app workspace
      - id: uv-lock
        args: [ --project, addons/personal-app ]
        files: ^addons/personal-app/(uv\.lock|pyproject\.toml|backend/pyproject\.toml|frontend/pyproject\.toml)$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.2
    hooks:
      - id: markdownlint-cli2
        files: ^addons/personal-app/.*\.md$

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        types: [ markdown ]
        files: ^addons/personal-app/
        exclude: ^addons/personal-app/CHANGELOG\.md$

  - repo: local
    hooks:
      - id: mkdocs-build
        name: properdocs build --strict
        entry: make -C addons/personal-app docs-build
        language: system
        files: ^addons/personal-app/(docs/|backend/src/|frontend/src/|tests/README\.md$|scripts/gen_.*\.py$|properdocs\.yml$|[^/]+\.md$)
        pass_filenames: false

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/(ci|quality-and-tests|release)\.yml$

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        files: ^\.github/(workflows/(ci|quality-and-tests|release)\.yml|actions/.*)$
