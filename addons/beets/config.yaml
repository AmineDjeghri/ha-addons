name: Beets
description: Music library manager and auto-tagger for your music library
version: "2.13.1"
slug: beets
url: "https://github.com/aminedjeghri/ha-addons/tree/main/addons/beets"
arch:
  - amd64
  - aarch64
  - armv7
init: false
map:
  - media:rw
options:
  library_path: "/media/music"
  watch_enabled: true
  watch_debounce_seconds: 300
  daily_incremental: true
  daily_incremental_time: "03:00"
  autotag: true
  write: true
  quiet: true
  quiet_fallback: "asis"
  timid: false
  incremental: true
  duplicate_action: "skip"
  genre_source: "track"
  genre_mode: "combine"
  duplicates_enabled: true
  duplicates_interval_hours: 12
  navidrome_url: ""
  navidrome_user: ""
  navidrome_password: ""
  acoustid_apikey: ""
schema:
  library_path: str
  watch_enabled: bool
  watch_debounce_seconds: int
  daily_incremental: bool
  daily_incremental_time: str
  autotag: bool
  write: bool
  quiet: bool
  quiet_fallback: list(skip|asis)
  timid: bool
  incremental: bool
  duplicate_action: list(add|remove|skip)
  genre_source: list(album|artist|track)
  genre_mode: list(keep|overwrite|combine)
  duplicates_enabled: bool
  duplicates_interval_hours: int
  navidrome_url: str?
  navidrome_user: str?
  navidrome_password: password? # pragma: allowlist secret
  acoustid_apikey: str? # pragma: allowlist secret
