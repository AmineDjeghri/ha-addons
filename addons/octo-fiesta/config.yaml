name: Octo-Fiesta
description: Subsonic proxy with multi-provider music streaming integration
version: "dev-798eaee"
slug: octo-fiesta
url: "https://github.com/aminedjeghri/ha-addons/tree/main/addons/octo-fiesta"
arch:
  - amd64
  - aarch64
init: false
ports:
  8080/tcp: 5274
ports_description:
  8080/tcp: Web interface
map:
  - config:rw
  - media:rw
webui: "http://[HOST]:[PORT:5274]"
options:
  subsonic_url: "http://homeassistant.local:4533"
  admin_username: ""
  admin_password: ""
  music_service: "SquidWTF"
  storage_mode: "Permanent"
  cache_duration_hours: 1
  enable_external_playlists: true
  playlists_directory: "playlists"
  explicit_filter: "All"
  download_mode: "Track"
  auto_upgrade_quality: false
  disable_library_scan: false
  folder_template: "{artist}/{album}/{track} - {title}"
  library_download_path: "/media/music"
  lyrics_enabled: true
  lyrics_lrclib_base_url: "https://lrclib.net"
  lyrics_write_lrc_file: true
  lyrics_allow_plain_fallback: true
  lyrics_timeout_seconds: 8
  deezer_arl: ""
  deezer_arl_fallback: ""
  deezer_quality: ""
  qobuz_auth_token: ""
  qobuz_user_id: ""
  qobuz_quality: ""
  squidwtf_source: "Tidal"
  squidwtf_quality: ""
  squidwtf_country: "US"
  squidwtf_instance_timeout: 5
  squidwtf_instance: ""
  squidwtf_instances_url: ""
  yandex_oauth_token: ""
  yandex_quality: ""
  yandex_language: "ru"
  yandex_include_unavailable: false
schema:
  subsonic_url: url
  admin_username: str?
  admin_password: password? # pragma: allowlist secret
  music_service: list(SquidWTF|Deezer|Qobuz|Yandex)
  storage_mode: list(Permanent|Cache)
  cache_duration_hours: int
  enable_external_playlists: bool
  playlists_directory: str
  explicit_filter: list(All|ExplicitOnly|CleanOnly)
  download_mode: list(Track|Album)
  auto_upgrade_quality: bool
  disable_library_scan: bool
  folder_template: str
  library_download_path: str
  lyrics_enabled: bool
  lyrics_lrclib_base_url: str
  lyrics_write_lrc_file: bool
  lyrics_allow_plain_fallback: bool
  lyrics_timeout_seconds: int
  deezer_arl: str?
  deezer_arl_fallback: str?
  deezer_quality: str?
  qobuz_auth_token: str?
  qobuz_user_id: str?
  qobuz_quality: str?
  squidwtf_source: list(Qobuz|Tidal|AmazonMusic|Deemix)
  squidwtf_quality: str?
  squidwtf_country: list(US|DE|AU)
  squidwtf_instance_timeout: int
  squidwtf_instance: str?
  squidwtf_instances_url: str?
  yandex_oauth_token: str?
  yandex_quality: str?
  yandex_language: str
  yandex_include_unavailable: bool
